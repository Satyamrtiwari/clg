version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: canteen_postgres
    restart: always
    environment:
      POSTGRES_DB: canteen_db
      POSTGRES_USER: canteen_user
      POSTGRES_PASSWORD: canteen_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen_user -d canteen_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: canteen_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canteen_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://canteen_user:canteen_password@postgres:5432/canteen_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: production-canteen-super-secret-key-2026
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: canteen_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
